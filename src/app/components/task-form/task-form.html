<div class="card p-4 shadow-sm mb-3">
    <h3 class="mb-3">Agregar nueva tarea</h3>
    <div class="mb-3">
        <label class="form-label">Título</label>
        <input 
            type="text" 
            class="form-control" 
            [(ngModel)] = "titulo"
            placeholder="Ingrese el titulo de la tarea"/>
    </div>
    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea 
            type="text" 
            class="form-control" 
            [(ngModel)] = "descripcion"
            rows="3"
            placeholder="Ingrese el titulo de la tarea">
        </textarea>        
    </div>
    <div class="mb-3">
        <label class="form-label">Prioridad</label>
        <select class="form-select" [(ngModel)]="prioridad">
            <option value="Alta">Alta</option>
            <option value="Media">Media</option>
            <option value="Baja">Baja</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Fecha limite</label>
        <input type="date" class="form-control" [(ngModel)]="fechaLimite">
    </div>
        <button class="btn btn-success" (click)="agregarTarea()">Enviar</button>
</div>
